<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finora v2.0.0 — Video Demo</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px; background: #171717; color: #fffdf8; font-family: "Segoe UI", Arial, sans-serif; }
    main { width: min(1100px, 100%); }
    p { margin: 0 0 8px; color: #9aa9ef; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0 0 24px; font: 700 clamp(32px, 6vw, 64px)/1 Georgia, serif; letter-spacing: -.03em; }
    video { display: block; width: 100%; max-height: 75vh; background: #000; border: 1px solid #3b3b3b; box-shadow: 8px 8px 0 #2447d8; }
    #unmute { display: block; margin-top: 24px; padding: 10px 18px; border: 0; background: #2447d8; color: #fffdf8; font-size: 15px; font-weight: 700; cursor: pointer; }
    a { display: inline-block; margin-top: 24px; color: #9aa9ef; text-underline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p>Application walkthrough</p>
    <h1>Finora v2.0.0</h1>
    <video id="demo" controls autoplay playsinline preload="auto">
      <source src="https://github.com/arianaDaboc/finance-tracker/releases/download/v2.0.0/financial_tracker_video.mp4" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>
    <button id="unmute" type="button" hidden>🔊 Turn on sound</button>
    <a href="https://github.com/arianaDaboc/finance-tracker/releases/tag/v2.0.0">Open the GitHub release</a>
  </main>
  <script>
    // Start the video as soon as the page opens. Browsers block autoplay with sound,
    // so fall back to muted playback and show a button to turn the sound on.
    (function () {
      var video = document.getElementById('demo');
      var btn = document.getElementById('unmute');
      function showUnmute() { btn.hidden = false; }
      btn.addEventListener('click', function () { video.muted = false; video.play(); btn.hidden = true; });
      video.addEventListener('volumechange', function () { if (!video.muted) btn.hidden = true; });
      var attempt = video.play();
      if (attempt && attempt.catch) {
        attempt.catch(function () { video.muted = true; video.play().then(showUnmute).catch(function () {}); });
      }
    })();
  </script>
</body>
</html>
