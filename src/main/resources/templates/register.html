<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account - Finora</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="auth-page"><section class="auth-visual"><a class="brand auth-brand" th:href="@{/login}"><span class="brand-mark">F</span><span><strong>Finora</strong><small>Finance tracker</small></span></a><div class="auth-quote"><p class="eyebrow">A more organized start</p><h1>Build a clearer view of your finances.</h1><p>Create an account and start tracking every transaction that matters.</p></div></section><section class="auth-content"><div class="auth-box"><h2>Create your account</h2><p class="auth-subtitle">Start organizing your finances today.</p><p class="alert alert-error" th:if="${error}" th:text="${error}"></p><form th:action="@{/register}" method="post"><div class="field"><label for="username">Username</label><input type="text" id="username" name="username" placeholder="Choose a username" autocomplete="username" required autofocus></div><div class="field"><label for="password">Password</label><input type="password" id="password" name="password" placeholder="Choose a secure password" autocomplete="new-password" required></div><button type="submit" class="btn btn-primary">Create account</button></form><p class="auth-switch">Already have an account? <a th:href="@{/login}">Sign in</a></p></div></section></main></body></html>
