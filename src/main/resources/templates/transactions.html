<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Transactions - Finora</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<div th:replace="~{fragments/nav :: navbar}"></div><main class="app-shell">
<header class="page-header"><div><p class="eyebrow">Management</p><h1>Transactions</h1><p>Record and review every movement of money.</p></div><span class="count-badge" th:text="${#lists.size(transactions)} + ' records'">0 records</span></header>
<section class="panel form-panel"><div class="section-heading"><div><p class="eyebrow">Quick entry</p><h2>New transaction</h2></div></div>
<form th:action="@{/transactions}" th:object="${newTransaction}" method="post" class="form-grid transaction-form">
<div class="field amount-field"><label for="amount">Amount</label><div class="input-suffix"><input type="number" step="0.01" min="0.01" id="amount" th:field="*{amount}" placeholder="0.00" required><span>RON</span></div></div>
<div class="field"><label for="type">Type</label><select id="type" th:field="*{type}"><option th:each="t : ${types}" th:value="${t}" th:text="${t.name() == 'INCOME' ? 'Income' : 'Expense'}"></option></select></div>
<div class="field"><label for="category">Category</label><select id="category" th:field="*{category.id}" required><option value="">Select one</option><option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option></select></div>
<div class="field"><label for="date">Date</label><input type="date" id="date" th:field="*{date}" required></div>
<div class="field description-field"><label for="description">Description</label><input type="text" id="description" th:field="*{description}" placeholder="e.g. Weekly groceries"></div>
<button type="submit" class="btn btn-primary submit-button"><span>+</span> Add</button></form>
<p class="form-hint" th:if="${#lists.isEmpty(categories)}">Create a category before adding your first transaction.</p></section>
<section class="panel table-panel"><div class="section-heading"><div><p class="eyebrow">History</p><h2>All transactions</h2></div></div><div class="table-wrap"><table><thead><tr><th>Details</th><th>Date</th><th>Type</th><th>Amount</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>
<tr th:each="t : ${transactions}"><td><div class="table-identity"><span class="transaction-avatar" th:classappend="${t.type.name() == 'INCOME'} ? ' avatar-income' : ' avatar-expense'" th:text="${#strings.substring(t.category.name,0,1)}">C</span><div><strong th:text="${t.description != null && !t.description.isBlank() ? t.description : t.category.name}"></strong><small th:text="${t.category.name}"></small></div></div></td><td th:text="${#temporals.format(t.date, 'dd MMM yyyy')}"></td><td><span class="type-pill" th:classappend="${t.type.name() == 'INCOME'} ? ' type-income' : ' type-expense'" th:text="${t.type.name() == 'INCOME' ? 'Income' : 'Expense'}"></span></td><td><strong class="transaction-amount" th:classappend="${t.type.name() == 'INCOME'} ? ' amount-income' : ' amount-expense'" th:text="${t.type.name() == 'INCOME' ? '+' : '-'} + ${#numbers.formatDecimal(t.amount, 1, 2)} + ' RON'"></strong></td><td><form th:action="@{/transactions/{id}/delete(id=${t.id})}" method="post"><button type="submit" class="icon-button danger" title="Delete transaction" aria-label="Delete transaction">×</button></form></td></tr>
<tr th:if="${#lists.isEmpty(transactions)}"><td colspan="5"><div class="empty-state"><span>↕</span><strong>No transactions yet</strong><p>Your transactions will appear here.</p></div></td></tr></tbody></table></div></section>
</main></body></html>
