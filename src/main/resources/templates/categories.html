<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Categories - Finora</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<div th:replace="~{fragments/nav :: navbar}"></div><main class="app-shell"><header class="page-header"><div><p class="eyebrow">Organization</p><h1>Categories</h1><p>Group income and expenses to make your reports easier to understand.</p></div><span class="count-badge" th:text="${#lists.size(categories)} + ' categories'">0 categories</span></header>
<section class="split-layout"><article class="panel form-panel sticky-panel"><div class="section-heading"><div><p class="eyebrow">New category</p><h2>Create a category</h2></div></div><form th:action="@{/categories}" th:object="${newCategory}" method="post" class="stack-form"><div class="field"><label for="name">Category name</label><input type="text" id="name" th:field="*{name}" placeholder="e.g. Groceries" required></div><div class="field"><label for="type">Category type</label><select id="type" th:field="*{type}"><option th:each="t : ${types}" th:value="${t}" th:text="${t.name() == 'INCOME' ? 'Income' : 'Expense'}"></option></select></div><button type="submit" class="btn btn-primary"><span>+</span> Create category</button></form></article>
<article class="panel categories-panel"><div class="section-heading"><div><p class="eyebrow">Your collection</p><h2>Active categories</h2></div></div><div class="category-list"><div class="category-item" th:each="c : ${categories}"><span class="category-symbol" th:classappend="${c.type.name() == 'INCOME'} ? ' avatar-income' : ' avatar-expense'" th:text="${#strings.substring(c.name,0,1)}">C</span><div class="category-info"><strong th:text="${c.name}">Category</strong><span class="type-pill" th:classappend="${c.type.name() == 'INCOME'} ? ' type-income' : ' type-expense'" th:text="${c.type.name() == 'INCOME' ? 'Income' : 'Expense'}"></span></div><form th:action="@{/categories/{id}/delete(id=${c.id})}" method="post"><button type="submit" class="icon-button danger" title="Delete category" aria-label="Delete category">×</button></form></div><div class="empty-state" th:if="${#lists.isEmpty(categories)}"><span>▦</span><strong>No categories yet</strong><p>Create your first category using the form.</p></div></div></article></section>
</main></body></html>
